[project]
name = "persona-api"
version = "0.1.0"
description = "An assistant's model of itself: fields, notes, and the provenance of both."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tochi-mba" }]
keywords = ["fastapi", "persona", "memory", "assistant", "mcp"]
classifiers = [
    "Private :: Do Not Upload",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyjwt>=2.9",
    "structlog>=24.4",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
persona-api = "persona_api.__main__:main"

[project.urls]
Repository = "https://github.com/tochi-mba/Persona-api"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "cryptography>=43.0",
    "import-linter>=2.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/persona_api"]

# --------------------------------------------------------------------------------------
# Lint / format
# --------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",      # builtin shadowing
    "ANN",    # missing annotations
    "ARG",    # unused arguments
    "ASYNC",  # async correctness
    "B",      # bugbear
    "C4",     # comprehensions
    "DTZ",    # naive datetimes
    "E",      # pycodestyle errors
    "EM",     # exception message hygiene
    "ERA",    # commented-out code
    "F",      # pyflakes
    "FA",     # future annotations
    "I",      # import sorting
    "ICN",    # import conventions
    "N",      # pep8-naming
    "PERF",   # performance anti-patterns
    "PIE",
    "PL",     # pylint subset
    "PT",     # pytest style
    "PTH",    # use pathlib
    "RET",    # return hygiene
    "RSE",
    "RUF",
    "S",      # bandit
    "SIM",    # simplify
    "SLF",    # private member access
    "T20",    # no print
    "TC",     # typing-only imports
    "TID",    # tidy imports
    "TRY",    # exception hygiene
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
ignore = [
    "ANN401",  # Any is occasionally the honest annotation
    "TRY003",  # long messages inline beat an exception subclass per message
]

[tool.ruff.lint.per-file-ignores]
# FastAPI resolves handler annotations at runtime to build the dependency graph and the
# OpenAPI schema, so its type-only-looking imports must stay importable at runtime.
"src/persona_api/api/routers/*" = ["TC001", "TC002", "TC003"]
"src/persona_api/api/dependencies.py" = ["TC001", "TC002", "TC003"]
# Pydantic resolves model field annotations at runtime to build validators and the
# JSON schema, so the types they name must be imported at runtime too.
"src/persona_api/api/schemas/*" = ["TC001", "TC002", "TC003"]
# A fake exists to be substitutable for the real thing, so it mirrors the real
# signatures exactly -- unused parameters, timeout arguments and all.
"tests/fakes/*" = ["ARG002", "ASYNC109"]
# An operational script, not library code: it prints (that is its output), it exits
# non-zero (that is its contract), and it talks to a real server over real HTTP.
"scripts/*" = ["T20", "S310", "PLR0915"]
"tests/**" = [
    "S101",    # asserts are the point
    "S105",    # test corpora contain literal credential-shaped strings on purpose
    "S106",
    "S107",
    "SLF001",  # tests may inspect private state
    "PLR2004", # magic numbers are fine in assertions
    "PLR0913", # helpers mirroring a wide API legitimately take many arguments
    "TC001",   # fixtures are annotated with the types they are, not deferred strings
    "TC002",
    "TC003",
    "PLC0415", # a local import inside one test keeps its setup next to its assertion
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["persona_api"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# --------------------------------------------------------------------------------------
# Types
# --------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_unimported = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# --------------------------------------------------------------------------------------
# Tests
# --------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["persona_api"]
branch = true
parallel = false

[tool.coverage.paths]
source = ["src/persona_api", "*/site-packages/persona_api"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
# Only non-executable lines are excluded. Nothing that contains real logic is
# excluded, and `# pragma: no cover` is not used anywhere in src/. See AGENTS.md.
exclude_also = [
    "^\\s*\\.\\.\\.$",
    "^\\s*if TYPE_CHECKING:",
    "^\\s*@(?:typing\\.)?overload$",
    "^\\s*raise NotImplementedError$",
    "^\\s*if __name__ == .__main__.:$",
]

# --------------------------------------------------------------------------------------
# Architecture (layering is enforced, not merely documented)
# --------------------------------------------------------------------------------------
[tool.importlinter]
root_package = "persona_api"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inward"
type = "layers"
layers = [
    "persona_api.api",
    "persona_api.auth",
    "persona_api.personas",
    "persona_api.memory",
    "persona_api.events",
    "persona_api.storage",
    "persona_api.domain",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Domain is independent"
type = "forbidden"
source_modules = ["persona_api.domain"]
forbidden_modules = [
    "persona_api.api",
    "persona_api.auth",
    "persona_api.core",
    "persona_api.events",
    "persona_api.memory",
    "persona_api.personas",
    "persona_api.storage",
]

[[tool.importlinter.contracts]]
name = "SQL stays behind the stores"
type = "forbidden"
source_modules = ["persona_api.api", "persona_api.auth", "persona_api.domain"]
forbidden_modules = ["persona_api.storage", "sqlite3"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Talking to keyring stays behind the auth adapter"
type = "forbidden"
source_modules = [
    "persona_api.api",
    "persona_api.personas",
    "persona_api.memory",
    "persona_api.events",
    "persona_api.domain",
    "persona_api.storage",
]
forbidden_modules = ["jwt", "httpx"]
allow_indirect_imports = true
